[project]
name = "ha-xiaomi-feeder"
version = "1.0.0"
description = "Home Assistant Community Store (HACS) custom integration for Xiaomi Smart Pet Food Feeder 2"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Stephan Höhn", email = "me@steph.ovh" },
]
requires-python = ">=3.14.2"
dependencies = [
    "xiaomi-feeder-2>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "homeassistant==2026.8.2",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "skip_next_meal.py"]
